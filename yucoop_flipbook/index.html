<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ユーコープ絵本 フリップブック</title>
  <style>
:root {
  --ink: #2c2a27;
  --muted: #6f6a63;
  --paper: #fffaf3;
  --accent: #bd6f7e;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  background:
    radial-gradient(circle at 48% 0%, rgba(255,255,255,.96), rgba(255,255,255,0) 42%),
    linear-gradient(135deg, #f9f1e7, #eaded0 52%, #f7f1ea);
}
.app {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}
header {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: center;
  padding: 12px clamp(14px, 3vw, 34px) 6px;
}
.title p {
  margin: 0 0 5px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}
.title h1 {
  margin: 0;
  font-size: clamp(25px, 3.5vw, 45px);
  line-height: 1.15;
}
.tools {
  display: grid;
  gap: 10px;
  justify-items: end;
}
.book-switcher,
.controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}
.book-switcher {
  padding: 4px;
  border: 1px solid rgba(94,71,40,.13);
  border-radius: 999px;
  background: rgba(255,255,255,.52);
}
button {
  min-height: 40px;
  border: 0;
  background: #fff;
  color: var(--ink);
  padding: 0 15px;
  border-radius: 999px;
  box-shadow: 0 7px 20px rgba(80,55,30,.14);
  font-weight: 800;
  cursor: pointer;
  transition: transform .15s ease, opacity .15s ease, background .15s ease, color .15s ease;
}
button:hover:not(:disabled) { transform: translateY(-1px); }
button:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.book-switcher button {
  min-height: 34px;
  padding: 0 16px;
  box-shadow: none;
  background: transparent;
  color: var(--muted);
}
.book-switcher button.active {
  background: var(--accent);
  color: #fff;
}
.viewer-wrap {
  display: grid;
  place-items: center;
  min-height: 0;
  padding: 4px clamp(10px, 2vw, 26px) 10px;
  overflow: hidden;
}
.viewer {
  width: min(96vw, 1180px);
  display: grid;
  place-items: center;
  perspective: 2600px;
}
.book {
  position: relative;
  width: min(96vw, 1180px);
  max-height: min(62vh, 720px);
  aspect-ratio: 1.626 / 1;
  transform-style: preserve-3d;
  filter: drop-shadow(0 24px 30px rgba(44,32,19,.23));
}
.page {
  position: absolute;
  inset: 0;
  margin: 0;
  overflow: hidden;
  border-radius: 12px;
  background: var(--paper);
  box-shadow: inset 0 0 30px rgba(50,32,12,.05);
}
.page img,
.flip-layer img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}
.hint-zone {
  position: absolute;
  inset: 0;
  z-index: 8;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.hint-zone button {
  opacity: 0;
  min-height: 0;
  border-radius: 0;
  padding: 0;
  background: transparent;
  box-shadow: none;
}
.flip-layer {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 12;
  transform-style: preserve-3d;
  background: var(--paper);
  overflow: hidden;
  backface-visibility: hidden;
  border-radius: 12px;
  box-shadow: 0 12px 36px rgba(35,22,10,.24);
}
.flip-layer::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,.18), rgba(255,255,255,0) 38%, rgba(255,255,255,.22));
  opacity: .4;
  pointer-events: none;
}
.flip-layer.next {
  display: block;
  transform-origin: left center;
  animation: flipNext .78s cubic-bezier(.2,.7,.15,1) forwards;
}
.flip-layer.prev {
  display: block;
  transform-origin: right center;
  animation: flipPrev .78s cubic-bezier(.2,.7,.15,1) forwards;
}
footer {
  padding: 0 clamp(16px, 3vw, 34px) 10px;
  display: grid;
  gap: 8px;
  justify-items: center;
}
.range-row {
  width: min(780px, 92vw);
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
}
input[type="range"] { width: 100%; accent-color: var(--accent); }
.status {
  padding: 8px 12px;
  background: rgba(255,255,255,.68);
  border-radius: 999px;
  color: var(--muted);
  font-size: 13px;
  box-shadow: 0 4px 14px rgba(80,55,30,.08);
}
@keyframes flipNext {
  0% { transform: rotateY(0deg); }
  38% { filter: brightness(.96); }
  100% { transform: rotateY(-178deg); }
}
@keyframes flipPrev {
  0% { transform: rotateY(0deg); }
  38% { filter: brightness(.96); }
  100% { transform: rotateY(178deg); }
}
@media (min-width: 861px) and (max-height: 760px) {
  .book { max-height: min(56vh, 640px); }
  .title h1 { font-size: clamp(22px, 3vw, 35px); }
  button { min-height: 34px; }
  .status { padding-top: 6px; padding-bottom: 6px; }
}
@media (max-width: 860px) {
  .app { overflow: auto; }
  header { align-items: flex-start; flex-direction: column; }
  .tools { width: 100%; justify-items: start; }
  .book-switcher, .controls { justify-content: flex-start; }
  .book { width: min(96vw, 1180px); max-height: none; }
}
@media (max-width: 540px) {
  header { padding-top: 12px; }
  .title h1 { font-size: 30px; }
  .book-switcher, .controls { width: 100%; }
  .book-switcher {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .book-switcher button,
  .controls button {
    min-width: 0;
    padding-right: 10px;
    padding-left: 10px;
    white-space: nowrap;
  }
}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <p>ユーコープ絵本 フリップブック</p>
        <h1 id="bookTitle">てとてと</h1>
      </div>
      <div class="tools" aria-label="冊子とページ操作">
        <div class="book-switcher" aria-label="冊子選択">
          <button id="tetotetoBtn" class="active" type="button">てとてと</button>
          <button id="mogumoguBtn" type="button">もぐもぐ</button>
        </div>
        <div class="controls">
          <button id="firstBtn" type="button">最初</button>
          <button id="prevBtn" type="button">← 戻る</button>
          <button id="nextBtn" type="button">次へ →</button>
          <button id="lastBtn" type="button">最後</button>
        </div>
      </div>
    </header>
    <main class="viewer-wrap">
      <div class="viewer">
        <div id="book" class="book" aria-live="polite">
          <figure class="page"><img id="pageImg" alt="冊子ページ"></figure>
          <div id="flipLayer" class="flip-layer"><img id="flipImg" alt=""></div>
          <div class="hint-zone" aria-hidden="true">
            <button id="leftClick" type="button" tabindex="-1">前へ</button>
            <button id="rightClick" type="button" tabindex="-1">次へ</button>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div class="range-row">
        <span>最初</span>
        <input id="pageRange" type="range" min="0" value="0" aria-label="表示ページ">
        <span>最後</span>
      </div>
      <div id="statusText" class="status"></div>
    </footer>
  </div>
  <script>
const BOOKS = {
  tetoteto: {
    title: "てとてと",
    pages: Array.from({ length: 7 }, (_, i) => `assets/tetoteto-page-${String(i + 1).padStart(2, "0")}.jpg`)
  },
  mogumogu: {
    title: "もぐもぐ",
    pages: Array.from({ length: 8 }, (_, i) => `assets/mogumogu-page-${String(i + 1).padStart(2, "0")}.jpg`)
  }
};
const FLIP_MS = 760;
let activeBookId = "tetoteto";
let viewIndex = 0;
let isAnimating = false;
let touchStart = 0;

const bookTitle = document.getElementById("bookTitle");
const pageImg = document.getElementById("pageImg");
const flipLayer = document.getElementById("flipLayer");
const flipImg = document.getElementById("flipImg");
const statusText = document.getElementById("statusText");
const pageRange = document.getElementById("pageRange");
const firstBtn = document.getElementById("firstBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const lastBtn = document.getElementById("lastBtn");
const tetotetoBtn = document.getElementById("tetotetoBtn");
const mogumoguBtn = document.getElementById("mogumoguBtn");
const book = document.getElementById("book");

function activeBook() {
  return BOOKS[activeBookId];
}

function render() {
  const bookData = activeBook();
  bookTitle.textContent = bookData.title;
  pageImg.src = bookData.pages[viewIndex];
  pageRange.max = String(bookData.pages.length - 1);
  pageRange.value = String(viewIndex);
  statusText.textContent = `${viewIndex + 1} / ${bookData.pages.length}`;
  firstBtn.disabled = isAnimating || viewIndex === 0;
  prevBtn.disabled = isAnimating || viewIndex === 0;
  nextBtn.disabled = isAnimating || viewIndex === bookData.pages.length - 1;
  lastBtn.disabled = isAnimating || viewIndex === bookData.pages.length - 1;
  pageRange.disabled = isAnimating;
  tetotetoBtn.classList.toggle("active", activeBookId === "tetoteto");
  mogumoguBtn.classList.toggle("active", activeBookId === "mogumogu");
}

function goTo(targetIndex) {
  const bookData = activeBook();
  if (isAnimating || targetIndex < 0 || targetIndex >= bookData.pages.length || targetIndex === viewIndex) return;

  const direction = targetIndex > viewIndex ? "next" : "prev";
  isAnimating = true;
  flipImg.src = bookData.pages[viewIndex];
  flipLayer.className = `flip-layer ${direction}`;
  render();

  window.setTimeout(() => {
    viewIndex = targetIndex;
    flipLayer.className = "flip-layer";
    flipImg.removeAttribute("src");
    isAnimating = false;
    render();
  }, FLIP_MS);
}

function switchBook(bookId) {
  if (bookId === activeBookId) return;
  activeBookId = bookId;
  viewIndex = 0;
  isAnimating = false;
  flipLayer.className = "flip-layer";
  render();
}

firstBtn.addEventListener("click", () => goTo(0));
prevBtn.addEventListener("click", () => goTo(viewIndex - 1));
nextBtn.addEventListener("click", () => goTo(viewIndex + 1));
lastBtn.addEventListener("click", () => goTo(activeBook().pages.length - 1));
document.getElementById("leftClick").addEventListener("click", () => goTo(viewIndex - 1));
document.getElementById("rightClick").addEventListener("click", () => goTo(viewIndex + 1));
pageRange.addEventListener("input", (event) => goTo(Number(event.target.value)));
tetotetoBtn.addEventListener("click", () => switchBook("tetoteto"));
mogumoguBtn.addEventListener("click", () => switchBook("mogumogu"));

document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
    event.preventDefault();
    goTo(viewIndex + 1);
  }
  if (event.key === "ArrowLeft" || event.key === "PageUp") {
    event.preventDefault();
    goTo(viewIndex - 1);
  }
  if (event.key === "Home") {
    event.preventDefault();
    goTo(0);
  }
  if (event.key === "End") {
    event.preventDefault();
    goTo(activeBook().pages.length - 1);
  }
});

book.addEventListener("touchstart", (event) => {
  touchStart = event.changedTouches[0].screenX;
}, { passive: true });

book.addEventListener("touchend", (event) => {
  const diff = event.changedTouches[0].screenX - touchStart;
  if (Math.abs(diff) > 44) {
    goTo(diff < 0 ? viewIndex + 1 : viewIndex - 1);
  }
}, { passive: true });

Object.values(BOOKS).flatMap((bookData) => bookData.pages).forEach((src) => {
  const img = new Image();
  img.src = src;
});
render();
  </script>
</body>
</html>
